name: Validate and package FolhaCerta
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: folhacerta-pwa
          path: dist/
  android:
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: folhacerta-pwa
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: folhacerta-test-signing-v1
      - name: Prepare official Android SDK tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Compile, sign and validate APK
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FolhaCerta-Android
          path: |
            android/build/FolhaCerta-1.0.0.apk
            android/build/verification.txt
            android/build/SHA256SUMS.txt
      - name: Publish installable test package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          PWA local empacotado para Android 9 ou superior. Nenhuma permissão de internet, leitura de armazenamento ou conta é solicitada. PDFs são selecionados pelo seletor de documentos do Android.

          APK de testes assinado com certificado de desenvolvimento. Não é uma versão da Play Store. Assinatura, alinhamento, manifesto e SHA-256 foram verificados pelas ferramentas oficiais do Android SDK. A chave de teste é reutilizada pelo cache do Actions; se esse cache for perdido, uma atualização pode exigir reinstalação. Exporte um backup antes de reinstalar.

          O site e o APK possuem históricos separados. Transfira usando Exportar backup / Restaurar backup. Validação de assinatura não equivale a teste em aparelho físico.
          NOTES
          gh release create "v1.0.0-build-${{ github.run_number }}" --target "$GITHUB_SHA" --title 'FolhaCerta 1.0.0 — APK de testes' --prerelease --notes-file /tmp/release-notes.md android/build/FolhaCerta-1.0.0.apk android/build/verification.txt android/build/SHA256SUMS.txt
  android-smoke:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: FolhaCerta-Android
          path: android/build
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: folhacerta-test-signing-v1
      - name: Prepare Android 15 emulator
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platforms;android-35' 'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64' >/dev/null
          export ANDROID_AVD_HOME="$RUNNER_TEMP/folhacerta-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name FolhaCerta --path "$ANDROID_AVD_HOME/FolhaCerta.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
          test -f "$ANDROID_AVD_HOME/FolhaCerta.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s/FolhaCerta.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/FolhaCerta.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          sudo chmod a+rw /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" -avd FolhaCerta -no-window -gpu swiftshader -feature -Vulkan -memory 2048 -cores 2 -no-audio -no-boot-anim -no-snapshot </dev/null > /tmp/folhacerta-emulator.log 2>&1 &
      - name: Test native APK, local PDF and persistence
        run: bash scripts/test-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FolhaCerta-Android-smoke
          path: |
            android-test/build/result.txt
            android-test/build/android.png
            /tmp/folhacerta-emulator.log
